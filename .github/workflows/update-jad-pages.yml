name: Refresh JAD data and publish Pages

on:
  schedule:
    # Runs daily at 08:17 Asia/Jakarta. GitHub may delay scheduled runs.
    - cron: "17 8 * * *"
      timezone: "Asia/Jakarta"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-jad-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out dashboard
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Excel reader
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Sign in to Microsoft using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Refresh JAD data from OneDrive or SharePoint
        shell: bash
        env:
          JAD_DRIVE_ID: ${{ vars.JAD_DRIVE_ID }}
          JAD_ITEM_ID: ${{ vars.JAD_ITEM_ID }}
        run: |
          GRAPH_ACCESS_TOKEN="$(az account get-access-token --resource-type ms-graph --query accessToken --output tsv)"
          export GRAPH_ACCESS_TOKEN
          python scripts/update_jad_from_graph.py

      - name: Prepare public site files
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets _site/assets

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish updated dashboard
        id: deployment
        uses: actions/deploy-pages@v4
