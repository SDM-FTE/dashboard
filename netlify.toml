[build]
  command = "node scripts/build-site.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/jad-applications"
  to = "/.netlify/functions/jad-applications"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin-auth?action=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/admin-auth?action=page&page=index"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/admin-auth?action=page&page=:splat"
  status = 200
  force = true

[[headers]]
  for = "/admin*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/admin/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
